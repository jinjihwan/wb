name: 데이터 수집 및 GitHub Pages 배포

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'js/**'
      - 'scripts/**'
      - 'config/**'
      - 'data/watchlists.json'
      - '.github/workflows/publish.yml'
  schedule:
    # UTC 기준. 예약 실행은 지연되거나 누락될 수 있습니다.
    - cron: '17 2 * * 1-5'
    - cron: '41 14,17,20 * * 1-5'
  workflow_dispatch:
    inputs:
      force_financials:
        description: '재무제표 강제 재수집 (전체 관심 기업)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: compound-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: SEC quarterly filings → public JSON
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FORCE_FINANCIALS: ${{ github.event.inputs.force_financials || 'false' }}
          FINANCIAL_MAX_AGE_HOURS: '72'
        run: python scripts/update_financials.py
      - name: Update closing prices and optional Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/update_prices.py
      - name: Build trailing and historical P/E
        run: python scripts/update_valuation.py
      - name: Audit missing financial metrics and PER coverage
        run: python scripts/audit_collection.py
      - name: Save fetched public data to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials.json data/prices.json data/alert_state.json data/valuation.json data/valuation_history.json data/collection_status.json data/collection_status.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh public market data [skip ci]"
            # A second commit might reach main while this long workflow runs.
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep 2
            done
            echo 'Could not push updated data after three attempts.' >&2
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
